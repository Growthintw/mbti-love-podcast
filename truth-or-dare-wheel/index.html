<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>真心轉一圈｜人生・感情・事業情緒輪盤</title>
  <meta name="description" content="先轉主題，再轉情緒，從人生、感情與事業的真實情境裡，抽出一題真心話或大冒險。">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <header>
    <a class="brand" href="../"><span class="logo">▥</span><strong>MBTI 情感經驗 <i>Podcast</i></strong></a>
    <a class="back" href="../#more">返回其他互動</a>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">TRUTH OR DARE · EMOTION WHEEL</p>
      <h1>真心轉一圈</h1>
      <p>先轉出人生、感情或事業，再讓情緒決定你要回想哪一段故事。</p>
      <ol class="steps" aria-label="遊戲步驟">
        <li class="active" id="stepTopic"><b>1</b>轉主題</li>
        <li id="stepEmotion"><b>2</b>轉情緒</li>
        <li id="stepAnswer"><b>3</b>回答題目</li>
      </ol>
    </section>

    <section class="game" aria-label="雙輪盤遊戲">
      <article class="wheel-card active" id="topicCard">
        <div class="card-head"><span>第一輪</span><h2>你想聊哪一面？</h2></div>
        <div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="topicWheel" width="600" height="600"></canvas></div>
        <button class="spin" id="spinTopic" type="button">轉動主題輪盤</button>
        <p class="selection" id="topicSelection" aria-live="polite">尚未選出主題</p>
      </article>

      <article class="wheel-card locked" id="emotionCard">
        <div class="card-head"><span>第二輪</span><h2>那是什麼感受？</h2></div>
        <div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="emotionWheel" width="600" height="600"></canvas></div>
        <button class="spin coral" id="spinEmotion" type="button" disabled>先完成第一輪</button>
        <p class="selection" id="emotionSelection" aria-live="polite">等待主題結果</p>
      </article>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="result-meta"><span id="resultTopic"></span><span id="resultEmotion"></span><span class="mode" id="resultMode"></span></div>
      <p class="prompt-label">輪到你了</p>
      <h2 id="question"></h2>
      <div class="clue"><b>回答線索</b><p id="clue"></p></div>
      <div class="result-actions">
        <button type="button" id="anotherQuestion">同組合再抽一題</button>
        <button type="button" id="restart">重新轉輪盤</button>
      </div>
    </section>
  </main>

  <footer><p>如果題目太靠近不想談的經驗，可以跳過。真心不是被逼出來的。</p><a href="../">回到 Podcast 首頁</a></footer>
  <script src="script.js?v=1"></script>
</body>
</html>
